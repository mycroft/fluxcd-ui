image:
  repository: registry.mkz.me/mycroft/fluxcd-ui
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

serviceAccount:
  create: true
  # Defaults to the release's full name.
  name: ""
  annotations: {}

rbac:
  # Create a ClusterRole granting read-only access (get/list/watch) to the
  # Flux objects shown in the UI, bound to the service account. With
  # actions.enabled, it also grants patch on them.
  create: true

# Namespace of the Flux controllers.
fluxNamespace: flux-system

logs:
  # Offer the Flux controllers' recent logs about an object in its detail
  # drawer. Grants reading pods and their logs in fluxNamespace only.
  enabled: true

artifactBrowser:
  # Offer to browse the files of a source's artifact (Git, OCI and Bucket
  # sources, HelmCharts, HelmRepository indexes) in its detail drawer.
  # Anyone who can reach the UI can then read the repositories' files.
  enabled: true

yamlView:
  # Offer each Flux object as YAML in its detail drawer. Anyone who can reach
  # the UI can then read the objects, including a HelmRelease's inline values
  # and a Kustomization's postBuild substitutions.
  enabled: true

diff:
  # Offer to diff a Kustomization's source with the cluster, in its detail
  # drawer: fluxcd-ui downloads the source artifact from source-controller,
  # builds it, and compares the result with the live objects (read-only,
  # with the same access as managedObjects.status).
  enabled: true
  networkPolicy:
    # Flux's default NetworkPolicies only let pods of fluxNamespace reach
    # source-controller: allow fluxcd-ui's pods to fetch artifacts too (for
    # the diff and the artifact browser).
    create: true

helmRelease:
  content:
    # Offer the values and rendered manifest of a HelmRelease's current Helm
    # release in its detail drawer. Helm stores releases in Secrets, so this
    # grants reading Secrets in every namespace, and release values often
    # hold credentials. With authorization.mode=rbac, only users granted the
    # "inspect" verb on the HelmRelease can view them; with mode none, anyone
    # who can reach the UI can.
    enabled: false

managedObjects:
  status:
    # Show the health of the objects a Kustomization or HelmRelease manages,
    # in its detail drawer. Binds the built-in "view" ClusterRole, which
    # reads most resources but never Secrets.
    enabled: true
    # Extra read rules for kinds "view" does not cover (custom resources
    # whose roles do not aggregate to view). Objects still unreadable show
    # as "no access".
    extraRules: []
    #  - apiGroups: ["postgresql.cnpg.io"]
    #    resources: ["clusters", "databases"]
    #    verbs: ["get", "list"]

actions:
  # Allow suspending, resuming and reconciling Flux objects from the UI.
  # Anyone who can reach the UI can then do so: only enable this behind an
  # authenticating proxy (see auth.userHeader).
  enabled: false

auth:
  # Request header carrying the user name set by the authenticating proxy in
  # front of the UI: X-authentik-username (authentik), X-Auth-Request-User or
  # X-Forwarded-User (oauth2-proxy). When set, actions are refused without it
  # and logged with the user name.
  userHeader: ""
  # Request header carrying the user's groups: X-authentik-groups (authentik,
  # separator "|"), X-Forwarded-Groups or X-Auth-Request-Groups (oauth2-proxy,
  # separator ",").
  groupsHeader: ""
  groupsSeparator: ","
  # Sign-out endpoint of the proxy, linked next to the user's name. The proxy
  # keeps the user's groups for the length of its session: signing out picks
  # up changes made in the identity provider. /outpost.goauthentik.io/sign_out
  # (authentik), /oauth2/sign_out (oauth2-proxy).
  signOutURL: ""

authorization:
  # Who may act when actions are enabled, and inspect Helm releases when
  # helmRelease.content is enabled:
  #   none: every user who reaches the UI.
  #   rbac: users granted the "reconcile" / "suspend" / "inspect" verbs by
  #         Kubernetes RBAC, checked with SubjectAccessReviews. Requires
  #         auth.userHeader.
  mode: none
  # Prepended to user and group names before checking RBAC, so that a header
  # can never name a built-in identity such as system:masters. Bind roles to
  # e.g. "fluxcd-ui:team-a". Must not be empty or start with "system:".
  subjectPrefix: "fluxcd-ui:"
  # Create the <fullname>-operator (reconcile, suspend),
  # <fullname>-reconciler (reconcile) and <fullname>-inspector (inspect)
  # ClusterRoles, ready to bind to groups.
  createRoles: true
  # Bind those roles to the proxy's groups and users, written as the proxy
  # sends them: the chart adds subjectPrefix. Without namespaces, a binding
  # applies cluster-wide (a ClusterRoleBinding); with them, a RoleBinding in
  # each. For example:
  #   - role: operator              # operator, reconciler or inspector
  #     groups: ["flux-admins"]
  #   - role: reconciler
  #     groups: ["team-a"]
  #     users: ["alice"]
  #     namespaces: ["apps"]
  bindings: []

# debug, info, warn or error
logLevel: info
# text or json
logFormat: json
extraArgs: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

# The UI has no built-in authentication: when exposing it, put it behind an
# authenticating proxy (e.g. oauth2-proxy or your ingress controller's auth).
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: flux.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: flux-example-com-tls
  #    hosts:
  #      - flux.example.com

# Memory grows with the number and size of Flux objects held in the cache.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
