{{- if and (or .Values.diff.enabled .Values.artifactBrowser.enabled) .Values.diff.networkPolicy.create -}}
# Let fluxcd-ui fetch source artifacts from source-controller, which Flux's
# default NetworkPolicies only open to pods of the Flux namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fluxcd-ui.fullname" . }}-artifacts
  namespace: {{ .Values.fluxNamespace }}
  labels:
    {{- include "fluxcd-ui.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: source-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "fluxcd-ui.selectorLabels" . | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
