{{- if and .Values.rbac.create .Values.helmRelease.content.enabled -}}
# Reading the Secrets Helm stores releases in, for their values and manifest
# in the detail drawer. A release is stored wherever its HelmRelease says
# (spec.storageNamespace), and RBAC cannot narrow Secrets down by type, so
# this covers every Secret of the cluster: fluxcd-ui only reads Secrets of
# type helm.sh/release.v1, named after a HelmRelease's current release.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "fluxcd-ui.fullname" . }}-release-content
  labels:
    {{- include "fluxcd-ui.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "fluxcd-ui.fullname" . }}-release-content
  labels:
    {{- include "fluxcd-ui.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "fluxcd-ui.fullname" . }}-release-content
subjects:
  - kind: ServiceAccount
    name: {{ include "fluxcd-ui.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
